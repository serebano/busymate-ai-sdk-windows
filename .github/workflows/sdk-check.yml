name: SDK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sdk-check:
    # Our ephemeral k3s runner (scale set ci-sdk-windows, Ubuntu 24.04); never GitHub-hosted (owner order 2026-11-04).
    # There is no Windows runner: the .NET 8 SDK cross-builds the net8.0-windows projects on Linux
    # (EnableWindowsTargeting), so CI verifies, compiles the SDK, the WPF example and the unit tests, packs the
    # NuGet package and publishes the win-x64 example. The unit tests need the Windows Desktop runtime to EXECUTE,
    # which Linux does not have: run `dotnet test` on a real Windows machine before a release (README).
    runs-on: ci-sdk-windows
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_INSTALL_DIR: /home/runner/.dotnet
      EnableWindowsTargeting: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: No GitHub-hosted runners (runs-on lint)
        run: python3 .github/runs-on-lint.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify immutable source
        run: python3 scripts/verify-release.py
      - name: Build SDK
        run: dotnet build src/Busymate.AI/Busymate.AI.csproj -c Release
      - name: Build WPF example
        run: dotnet build example-app/Busymate.AI.Example.Wpf/Busymate.AI.Example.Wpf.csproj -c Release
      - name: Build unit tests (execution needs Windows, see above)
        run: dotnet build tests/Busymate.AI.Tests/Busymate.AI.Tests.csproj -c Release
      - name: Pack NuGet package
        run: dotnet pack src/Busymate.AI/Busymate.AI.csproj -c Release --no-build -o artifacts/nupkg
      - name: Publish example (framework-dependent, win-x64)
        run: dotnet publish example-app/Busymate.AI.Example.Wpf/Busymate.AI.Example.Wpf.csproj -c Release -r win-x64 --self-contained false -o artifacts/example
      - name: Checksums
        run: sha256sum artifacts/nupkg/*.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: busymate-ai-sdk-windows-1.0.2
          path: artifacts/nupkg/*.nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: busymate-ai-example-wpf-win-x64
          path: artifacts/example
